name : 06-Contexts
run-name : 06-contexts | DEBUG - ${{ inputs.debug }}

on : 
  push :
  workflow_dispatch:
        inputs :
           debug :
             type : boolean
             default : false
env:
   MY_WORKFLOW_VAR : "workflow"
   MY_OVERWRITTEN_VAR : "workflow"

jobs:
    echo-data:
          runs-on : ubuntu-latest
          env:
             MY_JOB_VARN : "job"
             MY_OVERWRITTEN_VAR : "job"
          steps: 
            - name : Display information
              run : |
               echo "Event Name : ${{github.event_name}}"
               echo "ref : ${{github.ref}}"
               echo "sha : ${{github.sha}}"
               echo "Actor : ${{github.actor}}"
               echo "Workflow : ${{github.workflow}}"
               echo "Run number : ${{github.run_number}}"
            - name : Retrieve Variable
              # MY_VAR is stored as variables in Github
              run : |
                   echo "Variable value : ${{vars.MY_VAR}}"
            - name : Print Env Variables
              env :
                  MY_OVERWIRTTEN_VAR : "step"
              # Step level scope, prints step
              run : |
                  echo " Workflow env : ${{env.MY_WORKFLOW_VAR}}"
                  echo " Overwritten env : ${{env.MY_OVERWRITTEN_VAR}}"
            - name : Print Env Variables
              # This is under Job level scope, So it prints Job
              run : |
                  echo " Workflow env : ${{env.MY_WORKFLOW_VAR}}"
                  echo " Overwritten env : ${{env.MY_OVERWRITTEN_VAR}}"

    echo-data2:
      runs-on : ubuntu-latest
      steps:
        - name : Print Env Variables
          # Traditional Shell Variable, workflow level scope, prints workflow
          run : |
            echo " workflow env : $MY_WORKFLOW_VAR"
            echo " Overwrittern env : $MY_OVERWRITTEN_VAR" 
            
              

